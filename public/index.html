<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Arena</title>

    
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #26345f, #0b1024 60%);
    color: white;
    min-height: 100vh;
}

.container {
    width: 95%;
    max-width: 950px;
    margin: auto;
    padding: 20px 0 40px;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aeb8df;
    margin-bottom: 20px;
}

.panel {
    background: rgba(20, 27, 57, .92);
    border: 1px solid #394777;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    outline: none;
    margin-bottom: 10px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 17px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.primary {
    background: #5865f2;
    color: white;
}

.green {
    background: #20c997;
    color: white;
}

.red {
    background: #ef476f;
    color: white;
}

.orange {
    background: #ff9f1c;
    color: white;
}

.blue {
    background: #2196f3;
    color: white;
}

.gray {
    background: #46506f;
    color: white;
}

.room-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.room-code {
    background: #080d1e;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin-top: 12px;
    font-size: 20px;
    letter-spacing: 3px;
}

.hidden {
    display: none !important;
}

/* PLAYERS */

.players {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    gap: 12px;
}

.player {
    background: #111936;
    padding: 15px;
    border-radius: 17px;
}

.player-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.hp-container {
    width: 100%;
    height: 20px;
    background: #303852;
    border-radius: 20px;
    overflow: hidden;
}

.hp {
    height: 100%;
    width: 100%;
    background: #20c997;
    transition: .4s;
}

.hp-text {
    margin-top: 6px;
    font-size: 14px;
}

.vs {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    color: #ffcc00;
}

/* TIMER */

.timer-box {
    text-align: center;
    margin: 15px 0;
}

.timer {
    display: inline-flex;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 6px solid #5865f2;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: bold;
}

/* QUESTION */

.question {
    font-size: 23px;
    text-align: center;
    line-height: 1.7;
    margin: 15px 0 20px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.answer {
    background: #222b50;
    color: white;
    border: 2px solid #35406b;
    min-height: 60px;
}

.answer:hover {
    background: #303b69;
}

.answer.correct {
    background: #168f68;
}

.answer.wrong {
    background: #c93659;
}

/* POWERS */

.power-title {
    text-align: center;
    margin-bottom: 12px;
}

.powers {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.power {
    background: #242d50;
    color: white;
    min-height: 70px;
    font-size: 13px;
}

.power span {
    display: block;
    font-size: 22px;
    margin-bottom: 5px;
}

.power:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

/* LOG */

.log {
    background: #080d1e;
    border-radius: 12px;
    padding: 12px;
    height: 130px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.8;
}

.status {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: #1b2548;
    margin-bottom: 12px;
}

/* GAME OVER */

.game-over {
    text-align: center;
    padding: 30px;
}

.game-over h2 {
    font-size: 35px;
    margin-bottom: 15px;
}

@media(max-width:650px) {

    h1 {
        font-size: 30px;
    }

    .players {
        grid-template-columns: 1fr 45px 1fr;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .powers {
        grid-template-columns: repeat(3, 1fr);
    }

    .power {
        min-height: 65px;
    }

    .room-buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>⚔️ Battle Arena</h1>
    <div class="subtitle">نبرد دو نفره با دانش و سرعت</div>

    <!-- LOBBY -->

    <div id="lobby" class="panel">

        <h2>🏠 ورود به بازی</h2>

        <br>

        <input
            id="playerName"
            type="text"
            placeholder="نام بازیکن"
            maxlength="15"
        >

        <div class="room-buttons">

            <button class="primary" onclick="createRoom()">
                ➕ ساخت اتاق
            </button>

            <button class="green" onclick="joinRoom()">
                🚪 ورود به اتاق
            </button>

        </div>

        <br>

        <input
            id="roomInput"
            type="text"
            placeholder="کد اتاق"
            maxlength="10"
        >

        <div id="roomInfo" class="hidden">

            <div class="room-code">
                کد اتاق:
                <strong id="roomCode"></strong>
            </div>

            <br>

            <button
                class="blue"
                style="width:100%"
                onclick="inviteTelegram()"
            >
                📱 دعوت دوست در تلگرام
            </button>

        </div>

    </div>


    <!-- GAME -->

    <div id="game" class="hidden">

        <div id="status" class="status">
            منتظر بازیکن دوم...
        </div>

        <div class="panel">

            <div class="players">

                <div class="player">

                    <div class="player-name">
                        👤 <span id="myName">بازیکن</span>
                    </div>

                    <div class="hp-container">
                        <div id="myHp" class="hp"></div>
                    </div>

                    <div class="hp-text">
                        ❤️ HP:
                        <span id="myHpText">100</span>
                    </div>

                    <div>
                        🔥 Combo:
                        <span id="myCombo">0</span>
                    </div>

                </div>

                <div class="vs">
                    VS
                </div>

                <div class="player">

                    <div class="player-name">
                        👤 <span id="enemyName">حریف</span>
                    </div>

                    <div class="hp-container">
                        <div id="enemyHp" class="hp"></div>
                    </div>

                    <div class="hp-text">
                        ❤️ HP:
                        <span id="enemyHpText">100</span>
                    </div>

                    <div>
                        🔥 Combo:
                        <span id="enemyCombo">0</span>
                    </div>

                </div>

            </div>

        </div>


        <div class="panel">

            <div class="timer-box">
                <div id="timer" class="timer">
                    15
                </div>
            </div>

            <div id="question" class="question">
                منتظر سؤال...
            </div>

            <div id="answers" class="answers"></div>

        </div>


        <div class="panel">

            <div class="power-title">
                ⚡ قدرت‌های ویژه
            </div>

            <div class="powers">

                <button
                    id="shieldBtn"
                    class="power"
                    onclick="usePower('shield')"
                >
                    <span>🛡️</span>
                    Shield
                </button>

                <button
                    id="doubleBtn"
                    class="power"
                    onclick="usePower('double')"
                >
                    <span>⚔️</span>
                    Double
                </button>

                <button
                    id="fiftyBtn"
                    class="power"
                    onclick="usePower('fifty')"
                >
                    <span>🎯</span>
                    50/50
                </button>

                <button
                    id="healBtn"
                    class="power"
                    onclick="usePower('heal')"
                >
                    <span>💚</span>
                    Heal
                </button>

                <button
                    id="fastBtn"
                    class="power"
                    onclick="usePower('fast')"
                >
                    <span>⚡</span>
                    حمله سریع
                </button>

            </div>

        </div>


        <div class="panel">

            <h3>📜 گزارش نبرد</h3>

            <br>

            <div id="battleLog" class="log">
                بازی آماده است...
            </div>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="panel hidden">

        <div class="game-over">

            <h2 id="winnerText">
                🏆 برنده!
            </h2>

            <p id="resultText"></p>

            <br>

            <button
                class="primary"
                onclick="location.reload()"
            >
                🔄 بازی دوباره
            </button>

        </div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

let socket;

let roomCode = "";
let playerName = "";

let myHP = 100;
let enemyHP = 100;

let myCombo = 0;
let enemyCombo = 0;

let timeLeft = 15;
let timerInterval = null;

let currentQuestion = null;

let powers = {
    shield: true,
    double: true,
    fifty: true,
    heal: true,
    fast: true
};


/* =========================
   CONNECTION
========================= */

try {

    socket = io();

    socket.on("connect", () => {

        addLog("🟢 اتصال به سرور برقرار شد.");

    });

    socket.on("disconnect", () => {

        addLog("🔴 اتصال به سرور قطع شد.");

        setStatus("اتصال به سرور قطع شد.");

    });

} catch(e) {

    console.log(e);

}


/* =========================
   CREATE ROOM
========================= */

function createRoom() {

    playerName =
        document.getElementById("playerName").value.trim();

    if (!playerName) {

        alert("ابتدا نام خودت را وارد کن.");
        return;

    }

    if (!socket) {

        alert("اتصال به سرور برقرار نیست.");
        return;

    }

    socket.emit("createRoom", {

        name: playerName

    });

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom() {

    playerName =
        document.getElementById("playerName").value.trim();

    roomCode =
        document.getElementById("roomInput").value.trim();

    if (!playerName) {

        alert("ابتدا نام خودت را وارد کن.");
        return;

    }

    if (!roomCode) {

        alert("کد اتاق را وارد کن.");
        return;

    }

    socket.emit("joinRoom", {

        roomCode: roomCode,
        name: playerName

    });

}


/* =========================
   ROOM CREATED
========================= */

if (socket) {

socket.on("roomCreated", data => {

    roomCode = data.roomCode || data.code;

    document
        .getElementById("roomCode")
        .textContent = roomCode;

    document
        .getElementById("roomInfo")
        .classList.remove("hidden");

    setStatus(
        "اتاق ساخته شد؛ منتظر ورود دوستت هستیم..."
    );

    addLog(
        "🏠 اتاق " + roomCode + " ساخته شد."
    );

});

}


/* =========================
   PLAYER JOINED
========================= */

if (socket) {

socket.on("playerJoined", data => {

    setStatus("🟢 بازیکن دوم وارد شد!");

    if (data.enemyName) {

        document
            .getElementById("enemyName")
            .textContent = data.enemyName;

    }

    addLog("⚔️ حریف وارد نبرد شد.");

});

}


/* =========================
   START GAME
========================= */

if (socket) {

socket.on("gameStart", data => {

    document
        .getElementById("lobby")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    document
        .getElementById("myName")
        .textContent = playerName;

    if (data.enemyName) {

        document
            .getElementById("enemyName")
            .textContent = data.enemyName;

    }

    setStatus("🔥 نبرد شروع شد!");

    if (data.question) {

        showQuestion(data.question);

    }

});

}


/* =========================
   NEW QUESTION
========================= */

if (socket) {

socket.on("newQuestion", question => {

    showQuestion(question);

});

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(question) {

    currentQuestion = question;

    document
        .getElementById("question")
        .textContent =
        question.question || question.text || "سؤال";

    const answers =
        question.answers ||
        question.options ||
        [];

    const box =
        document.getElementById("answers");

    box.innerHTML = "";

    answers.forEach((answer, index) => {

        const btn =
            document.createElement("button");

        btn.className = "answer";

        btn.textContent =
            answer.text || answer;

        btn.onclick = () => {

            answerQuestion(index);

        };

        box.appendChild(btn);

    });

    startTimer();

}


/* =========================
   ANSWER
========================= */

function answerQuestion(index) {

    stopTimer();

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn => {

        btn.disabled = true;

    });

    if (socket) {

        socket.emit("answer", {

            roomCode: roomCode,
            answer: index,
            questionId:
                currentQuestion.id || null

        });

    }

}


/* =========================
   ANSWER RESULT
========================= */

if (socket) 

socket.on("answerResult", data => {

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === data.correctIndex) {
            button.classList.add("correct");
        }

    });

    if (data.correct) {

        myCombo++;

        document
            .getElementById("myCombo")
            .textContent = myCombo;

        setStatus("✅ پاسخ درست!");

        addLog(
            "✅ آفرین! پاسخ درست بود."
        );

    } else {

        myCombo = 0;

        document
            .getElementById("myCombo")
            .textContent = 0;

        buttons.forEach((button, index) => {

            if (index !== data.correctIndex) {
                button.classList.add("wrong");
            }

        });

        setStatus("❌ پاسخ غلط!");

        addLog(
            "❌ پاسخ اشتباه بود."
        );

    }

    if (data.damage) {

        addLog(
            "⚔️ " + data.damage + " آسیب وارد شد!"
        );

    }

});
}


/* =========================
   HP UPDATE
========================= */

if (socket) {

socket.on("hpUpdate", data => {

    if (data.myHP !== undefined) {

        myHP = data.myHP;

        updateHP(
            "myHp",
            "myHpText",
            myHP
        );

    }

    if (data.enemyHP !== undefined) {

        enemyHP = data.enemyHP;

        updateHP(
            "enemyHp",
            "enemyHpText",
            enemyHP
        );

    }

});

}


/* =========================
   POWER
========================= */

function usePower(power) {

    if (!powers[power]) {

        alert("این قدرت قبلاً استفاده شده!");
        return;

    }

    powers[power] = false;

    const buttonMap = {

        shield: "shieldBtn",
        double: "doubleBtn",
        fifty: "fiftyBtn",
        heal: "healBtn",
        fast: "fastBtn"

    };

    document
        .getElementById(buttonMap[power])
        .disabled = true;


    if (power === "fifty") {

        removeTwoWrongAnswers();

    }


    if (socket) {

        socket.emit("usePower", {

            roomCode: roomCode,
            power: power

        });

    }

    addLog(
        "⚡ قدرت " + power + " فعال شد!"
    );

}


/* =========================
   50/50
========================= */

function removeTwoWrongAnswers() {

    const buttons =
        Array.from(
            document.querySelectorAll(".answer")
        );

    if (buttons.length <= 2) return;

    let indexes = [];

    while (indexes.length < 2) {

        let random =
            Math.floor(
                Math.random() * buttons.length
            );

        if (!indexes.includes(random)) {

            indexes.push(random);

        }

    }

    indexes.forEach(index => {

        buttons[index].disabled = true;
        buttons[index].style.opacity = ".25";

    });

}


/* =========================
   TIMER
========================= */

function startTimer() {

    stopTimer();

    timeLeft = 15;

    document
        .getElementById("timer")
        .textContent = timeLeft;

    timerInterval =
        setInterval(() => {

            timeLeft--;

            document
                .getElementById("timer")
                .textContent = timeLeft;

            if (timeLeft <= 0) {

                stopTimer();

                timeUp();

            }

        }, 1000);

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


function timeUp() {

    document
        .querySelectorAll(".answer")
        .forEach(btn => {

            btn.disabled = true;

        });

    addLog("⏰ زمان تمام شد!");

    if (socket) {

        socket.emit("timeUp", {

            roomCode: roomCode

        });

    }

}


/* =========================
   POWER RESULT
========================= */

if (socket) {

socket.on("powerResult", data => {

    if (data.myHP !== undefined) {

        myHP = data.myHP;

        updateHP(
            "myHp",
            "myHpText",
            myHP
        );

    }

    if (data.enemyHP !== undefined) {

        enemyHP = data.enemyHP;

        updateHP(
            "enemyHp",
            "enemyHpText",
            enemyHP
        );

    }

    if (data.message) {

        addLog(data.message);

    }

});

}


/* =========================
   GAME OVER
========================= */

if (socket) {

socket.on("gameOver", data => {

    stopTimer();

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("gameOver")
        .classList.remove("hidden");

    if (data.winner === true) {

        document
            .getElementById("winnerText")
            .textContent =
            "🏆 تو برنده شدی!";

        document
            .getElementById("resultText")
            .textContent =
            "تبریک! حریفت را شکست دادی.";

    } else {

        document
            .getElementById("winnerText")
            .textContent =
            "😔 باختی!";

        document
            .getElementById("resultText")
            .textContent =
            "این بار نشد؛ دوباره امتحان کن.";

    }

});

}


/* =========================
   UPDATE HP
========================= */

function updateHP(bar, text, value) {

    value =
        Math.max(0, Math.min(100, value));

    document
        .getElementById(bar)
        .style.width = value + "%";

    document
        .getElementById(text)
        .textContent = value;

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

    document
        .getElementById("status")
        .textContent = text;

}


/* =========================
   LOG
========================= */

function addLog(text) {

    const log =
        document.getElementById("battleLog");

    const line =
        document.createElement("div");

    line.textContent = text;

    log.appendChild(line);

    log.scrollTop =
        log.scrollHeight;

}


/* =========================
   TELEGRAM INVITE
========================= */

function inviteTelegram() {

    const url =
        window.location.origin +
        "?room=" +
        encodeURIComponent(roomCode);

    const text =
        "⚔️ بیا با هم Battle Arena بازی کنیم!\n" +
        "کد اتاق: " +
        roomCode;

    const telegram =
        "https://t.me/share/url?url=" +
        encodeURIComponent(url) +
        "&text=" +
        encodeURIComponent(text);

    window.open(
        telegram,
        "_blank"
    );

}


/* =========================
   AUTO ROOM FROM URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const invitedRoom =
    params.get("room");

if (invitedRoom) {

    document
        .getElementById("roomInput")
        .value = invitedRoom;

}

</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>نبرد اطلاعات عمومی</title>

<style>

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 94%;
    max-width: 550px;
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 15px 40px #0006;
}

h1 {
    text-align: center;
    color: #243b55;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}

.main {
    background: #243b55;
    color: white;
}

.answer {
    background: #eeeeee;
}

.correct {
    background: green !important;
    color: white;
}

.wrong {
    background: red !important;
    color: white;
}

.hidden {
    display: none;
}

.room {
    text-align: center;
    background: #eef2ff;
    padding: 20px;
    border-radius: 15px;
    margin: 15px 0;
}

.code {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 5px;
    color: #3730a3;
    margin: 10px;
}

.players {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.player {
    flex: 1;
    background: #f3f4f6;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
}

.question {
    background: #f1f3f6;
    padding: 20px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

.status {
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
}

.small {
    text-align: center;
    color: #777;
}

</style>

</head>

<body>

<div class="game">

<div id="home">

<h1>🧠 نبرد اطلاعات عمومی</h1>

<input
id="name"
maxlength="20"
placeholder="نام خودت را وارد کن">

<button
class="main"
onclick="createRoom()">

🎮 ساخت بازی

</button>

<input
id="room"
placeholder="کد اتاق دوستت">

<button
class="main"
onclick="joinRoom()">

🔗 ورود به بازی

</button>

<p class="small">

برای بازی دو نفره، یک نفر اتاق بسازد
و کد اتاق را برای نفر دوم بفرستد.

</p>

</div>
    <!-- اتاق انتظار -->

<div id="lobby" class="hidden">

<h1>⏳ اتاق بازی</h1>

<div class="room">

<div>کد اتاق:</div>

<div class="code" id="roomCode"></div>

<button
class="main"
onclick="shareRoom()">

📤 دعوت از دوست

</button>

</div>

<div
class="players"
id="players">
</div>

<div
class="status"
id="waiting">

منتظر بازیکن دوم...

</div>

</div>


<!-- صفحه بازی -->

<div
id="gameScreen"
class="hidden">

<h1>⚔️ نبرد اطلاعات عمومی</h1>

<div class="players">

<div
class="player"
id="player1">

بازیکن ۱
<br>
⭐ 0

</div>
    

<div
class="player"
id="player2">

بازیکن ۲
<br>
⭐ 0

</div>

</div>

<div
class="small"
id="number">
</div>
<div
id="timer"
style="
text-align:center;
font-size:28px;
font-weight:bold;
margin:10px;
">
⏱️ 15
    
</div>
<div
class="question"
id="question">
</div>

<div id="answers">
</div>

<div
class="status"
id="status">
</div>

</div>


<!-- صفحه نتیجه -->

<div
id="result"
class="hidden">

<h1>🏆 پایان بازی</h1>

<h2
id="winner"
style="text-align:center">
</h2>

<div
id="finalScore"
style="text-align:center">
</div>

<button
class="main"
onclick="location.reload()">

🔄 بازی دوباره

</button>

</div>

</div>
    <script>

let socket = null;
let roomCode = "";
let answered = false;

function getName() {

    const name =
        document.getElementById("name").value.trim();

    return name || "بازیکن";

}

function connect() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket =
        new WebSocket(
            protocol + "//" + location.host
        );


    socket.onmessage = function(event) {

        const data =
            JSON.parse(event.data);

        handleMessage(data);

    };


    socket.onerror = function() {

        alert("خطا در اتصال به سرور.");

    };

}


function createRoom() {

    connect();

    socket.onopen = function() {

        socket.send(JSON.stringify({

            type: "create",

            name: getName()

        }));

    };
    

}


function joinRoom() {

    const code =
        document.getElementById("room")
        .value
        .trim()
        .toUpperCase();


    if (!code) {

        alert("کد اتاق را وارد کن.");

        return;

    }
    


    roomCode = code;

    connect();


    socket.onopen = function() {

        socket.send(JSON.stringify({

            type: "join",

            room: code,

            name: getName()

        }));

    };

    if (data.type === "roomCreated") {

        roomCode = data.room;

        document.getElementById("roomCode")
            .innerText = roomCode;

        showPage("lobby");

    }

        document.getElementById("waiting")

function handleMessage(data) {

    if (data.type === "roomCreated") {

        roomCode = data.room;

        document.getElementById("roomCode").innerText = roomCode;

        showPage("lobby");
    }

    if (data.type === "players") {

        document.getElementById("waiting").innerText =
            "بازیکن دوم وارد شد! بازی شروع می‌شود...";

    }

    if (data.type === "question") {

        showQuestion(data);

        const timer = document.getElementById("timer");

        if (timer) {
            timer.innerText = "⏱️ " + (data.time || 15);
        }
    }

    if (data.type === "timer") {

        const timer = document.getElementById("timer");

        if (timer) {
            timer.innerText = "⏱️ " + data.time;
        }
    }

    if (data.type === "timeUp") {

        const timer = document.getElementById("timer");

        if (timer) {
            timer.innerText = "⏰ زمان تمام شد!";
        }
    }
}
        

    if (data.type === "result") {

        showResult(data);

    }


    if (data.type === "gameOver") {

        showGameOver(data);

    }


    if (data.type === "error") {

        alert(data.message);

    }


    if (data.type === "opponentLeft") {

        alert("بازیکن مقابل از بازی خارج شد.");

    }

}


function showQuestion(data) {

    showPage("gameScreen");

    answered = false;


    document.getElementById("number")
        .innerText =
        "سؤال " +
        data.number +
        " از " +
        data.total;


    document.getElementById("question")
        .innerText =
        data.question;


    const box =
        document.getElementById("answers");


    box.innerHTML = "";


    data.answers.forEach(function(answer, index) {

        const button =
            document.createElement("button");


        button.className = "answer";

        button.innerText = answer;


        button.onclick = function() {

            sendAnswer(index, button);

        };


        box.appendChild(button);

    });


    document.getElementById("status")
        .innerText =
        "جوابت را انتخاب کن.";

}


function sendAnswer(index, button) {

    if (answered) return;

    answered = true;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(function(btn) {

        btn.disabled = true;

    });


    button.classList.add("wrong");


    socket.send(JSON.stringify({

        type: "answer",

        answer: index

    }));


    document.getElementById("status")
        .innerText =
        "⏳ منتظر جواب حریف...";

}


function showResult(data) {

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(function(button, index) {

        if (index === data.correct) {

            button.classList.remove("wrong");

            button.classList.add("correct");

        }

    });


    updateScores(data.scores);


    document.getElementById("status")
        .innerText =
        "✅ نتیجه مشخص شد.";

}


function updateScores(scores) {

    document.getElementById("player1")
        .innerHTML =
        "👤 بازیکن ۱<br>⭐ " +
        scores[0];


    document.getElementById("player2")
        .innerHTML =
        "👤 بازیکن ۲<br>⭐ " +
        scores[1];

}


function showGameOver(data) {

    showPage("result");


    let winner;


    if (data.scores[0] > data.scores[1]) {

        winner = "🏆 بازیکن ۱ برنده شد!";

    }

    else if (data.scores[1] > data.scores[0]) {

        winner = "🏆 بازیکن ۲ برنده شد!";

    }

    else {

        winner = "🤝 بازی مساوی شد!";

    }


    document.getElementById("winner")
        .innerText = winner;


    document.getElementById("finalScore")
        .innerHTML =
        "بازیکن ۱: " +
        data.scores[0] +
        " امتیاز<br><br>" +
        "بازیکن ۲: " +
        data.scores[1] +
        " امتیاز";

}


function showPage(page) {

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("lobby")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");


    document.getElementById(page)
        .classList.remove("hidden");

}


async function shareRoom() {

    const url =
        location.origin +
        "?room=" +
        roomCode;


    if (navigator.share) {

        await navigator.share({

            title: "نبرد اطلاعات عمومی",

            text: "بیا با من بازی کن 🎮",

            url: url

        });

    }

    else {

        await navigator.clipboard
            .writeText(url);

        alert("لینک بازی کپی شد.");

    }

}

</script>

</body>
</html>

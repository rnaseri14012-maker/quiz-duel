<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎲 Ludo Battle Online</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#07101f;
  --panel:#101b31;
  --panel2:#162442;
  --text:#f7f9ff;
  --muted:#9eacc9;
  --red:#ff3f68;
  --blue:#2698ff;
  --gold:#ffd43b;
  --green:#25d39b;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 20% 0%,#213b70 0,#07101f 38%),
    radial-gradient(circle at 100% 100%,#172d57 0,#07101f 45%);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:min(1200px,96%);
  margin:auto;
  padding:18px 0 30px;
}

.logo{
  text-align:center;
  font-size:clamp(28px,6vw,48px);
  font-weight:900;
  margin:8px 0 3px;
  text-shadow:0 5px 25px #0008;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:18px;
}

.card{
  background:linear-gradient(145deg,#111e36,#0c162a);
  border:1px solid #2a3d62;
  border-radius:22px;
  padding:16px;
  box-shadow:0 15px 40px #0005;
}

.lobby{
  max-width:480px;
  margin:25px auto;
}

.input{
  width:100%;
  border:1px solid #344b73;
  background:#081224;
  color:white;
  padding:14px;
  border-radius:14px;
  outline:none;
  margin-bottom:10px;
}

.input:focus{
  border-color:#648cff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn{
  border:0;
  padding:14px;
  border-radius:14px;
  font-weight:900;
  color:white;
}

.create{
  background:linear-gradient(135deg,#6472ff,#4351dc);
}

.join{
  background:linear-gradient(135deg,#20c997,#0ca678);
}

.invite{
  width:100%;
  margin-top:10px;
  background:#168de2;
}

.roomCode{
  text-align:center;
  font-size:28px;
  letter-spacing:5px;
  font-weight:900;
  color:var(--gold);
  padding:15px;
  background:#071020;
  border-radius:15px;
  margin-top:12px;
}

.gameGrid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:15px;
  align-items:start;
}

.players{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}

.playerBox{
  background:#091427;
  border:1px solid #293b60;
  padding:12px;
  border-radius:16px;
}

.playerName{
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  vertical-align:middle;
  margin-left:5px;
}

.redDot{
  background:var(--red);
  box-shadow:0 0 12px var(--red);
}

.blueDot{
  background:var(--blue);
  box-shadow:0 0 12px var(--blue);
}

.vs{
  text-align:center;
  font-weight:900;
  color:var(--gold);
}

.status{
  text-align:center;
  background:#0a1529;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  color:#dce6ff;
}

.boardWrap{
  display:flex;
  justify-content:center;
  padding:8px 0;
}

.board{
  width:min(92vw,620px);
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(11,1fr);
  grid-template-rows:repeat(11,1fr);
  background:#dfe7f6;
  border:5px solid #050a14;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 50px #0008;
}

.cell{
  position:relative;
  border:1px solid #aab6cc;
  background:#f8faff;
}

.path{
  background:#eef3fb;
}

.redHome{
  background:linear-gradient(145deg,#ff9bb2,#ff557d);
}

.blueHome{
  background:linear-gradient(145deg,#8ed0ff,#319fff);
}

.center{
  background:
    linear-gradient(
      45deg,
      var(--red) 0 50%,
      var(--blue) 50% 100%
    );
}

.finishRed{
  background:#ffb4c4;
}

.finishBlue{
  background:#a9d9ff;
}

.token{
  position:absolute;
  left:50%;
  top:50%;
  width:72%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:3px solid #fff;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:clamp(8px,2vw,14px);
  box-shadow:
    inset -5px -7px 10px #0005,
    inset 4px 4px 8px #fff8,
    0 4px 9px #0007;
  transition:.2s;
}

.redToken{
  background:
    radial-gradient(
      circle at 30% 25%,
      #ffced8,
      #ff3f68 45%,
      #9e1233
    );
}

.blueToken{
  background:
    radial-gradient(
      circle at 30% 25%,
      #d7efff,
      #2698ff 45%,
      #07509a
    );
}

.movable{
  animation:pulse 1s infinite;
  cursor:pointer;
}

.movable:hover{
  transform:translate(-50%,-50%) scale(1.15);
}

@keyframes pulse{
  0%,100%{
    box-shadow:
      0 0 0 0 #ffd43b00,
      inset -5px -7px 10px #0005,
      0 4px 9px #0007;
  }

  50%{
    box-shadow:
      0 0 0 8px #ffd43b55,
      0 0 25px #ffd43b,
      inset -5px -7px 10px #0005;
  }
}

.dicePanel{
  text-align:center;
}

.turnText{
  font-weight:900;
  margin-bottom:8px;
}

.dice{
  width:100px;
  height:100px;
  margin:10px auto 15px;
  border-radius:22px;
  background:linear-gradient(145deg,#fff,#d9e0ec);
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px;
  font-weight:900;
  box-shadow:
    inset -8px -8px 18px #9aa7bc88,
    0 15px 30px #0007;
}

.dice.rolling{
  animation:roll .7s ease;
}

@keyframes roll{
  0%{
    transform:rotate(0) scale(1);
  }

  25%{
    transform:rotate(90deg) scale(1.08);
  }

  50%{
    transform:rotate(180deg) scale(.95);
  }

  75%{
    transform:rotate(270deg) scale(1.08);
  }

  100%{
    transform:rotate(360deg) scale(1);
  }
}

.rollBtn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:linear-gradient(135deg,#ffd43b,#f59f00);
  color:#241800;
  font-weight:900;
  font-size:18px;
}

.rollBtn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.message{
  min-height:25px;
  margin-top:10px;
  color:#cbd6ef;
}

.chat{
  height:570px;
  display:flex;
  flex-direction:column;
}

.chatHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  padding-bottom:12px;
  border-bottom:1px solid #293b60;
}

.soundBtn{
  border:0;
  background:#203354;
  color:white;
  width:38px;
  height:38px;
  border-radius:12px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:12px 3px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.chatMessage{
  max-width:88%;
  padding:9px 12px;
  border-radius:15px;
  animation:messageIn .2s ease;
  word-break:break-word;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.chatMine{
  align-self:flex-start;
  background:linear-gradient(135deg,#4659df,#3444ae);
  border-bottom-right-radius:4px;
}

.chatOther{
  align-self:flex-end;
  background:#202f4d;
  border-bottom-left-radius:4px;
}

.chatName{
  font-size:11px;
  opacity:.7;
  margin-bottom:3px;
}

.quickEmoji{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:6px 0;
}

.emojiBtn{
  min-width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#1a2a48;
  cursor:pointer;
  font-size:20px;
}

.sendRow{
  display:grid;
  grid-template-columns:1fr 48px;
  gap:6px;
}

.chatInput{
  width:100%;
  background:#071224;
  color:white;
  border:1px solid #31466d;
  border-radius:13px;
  padding:11px;
  outline:none;
}

.sendBtn{
  border:0;
  border-radius:13px;
  background:#25b5ff;
  color:white;
  font-size:20px;
}

.winOverlay{
  position:fixed;
  inset:0;
  background:#020713cc;
  backdrop-filter:blur(7px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}

.winCard{
  width:min(470px,100%);
  text-align:center;
  background:linear-gradient(145deg,#17294a,#0b1528);
  border:1px solid #49618e;
  border-radius:28px;
  padding:30px 20px;
  box-shadow:0 30px 80px #000;
  animation:winIn .6s cubic-bezier(.2,.9,.2,1);
}

@keyframes winIn{
  from{
    transform:scale(.5) rotate(-4deg);
    opacity:0;
  }

  to{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.trophy{
  font-size:80px;
  animation:trophy 1s infinite alternate;
}

@keyframes trophy{
  from{
    transform:translateY(0) rotate(-5deg);
  }

  to{
    transform:translateY(-8px) rotate(5deg);
  }
}

.winTitle{
  font-size:34px;
  color:var(--gold);
  margin:10px 0;
}

.winText{
  line-height:1.9;
  color:#d7e1f7;
}

.again{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  background:linear-gradient(135deg,#25d39b,#099268);
  color:white;
  font-weight:900;
  margin-top:10px;
}

.confetti{
  position:fixed;
  width:10px;
  height:16px;
  top:-25px;
  z-index:1100;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }
}

.captureFlash{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:70px;
  z-index:1200;
  animation:flash .8s ease forwards;
  pointer-events:none;
}

@keyframes flash{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.4);
  }

  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.3);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.8);
  }
}

@media(max-width:850px){

  .gameGrid{
    grid-template-columns:1fr;
  }

  .chat{
    height:360px;
  }

}

@media(max-width:500px){

  .app{
    width:97%;
    padding-top:8px;
  }

  .card{
    border-radius:17px;
    padding:11px;
  }

  .board{
    border-width:3px;
    border-radius:12px;
  }

  .players{
    grid-template-columns:1fr 35px 1fr;
  }

  .playerBox{
    padding:9px;
    font-size:13px;
  }

  .dice{
    width:80px;
    height:80px;
    font-size:46px;
  }

}
</style>
</head>

<body>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let roomCode = "";
let myColor = "red";
let myTurn = false;
let gameStarted = false;
let currentDice = null;
let soundEnabled = true;

const path = [

[0,4],[0,5],[0,6],
[1,6],[2,6],[3,6],[4,6],
[4,7],[4,8],[4,9],[4,10],
[5,10],
[6,10],[6,9],[6,8],[6,7],[6,6],
[7,6],[8,6],[9,6],[10,6],
[10,5],[10,4],
[10,3],[10,2],[10,1],[10,0],
[9,0],[8,0],[7,0],
[6,0],
[6,1],[6,2],[6,3],[6,4],[6,5],
[5,0],
[4,0],[4,1],[4,2],[4,3],[4,4],
[3,4],[2,4],[1,4]

];

let audioContext = null;

function audio(){

    if(!soundEnabled) return null;

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        return audioContext;

    }catch{

        return null;

    }

}

function tone(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    const ctx = audio();

    if(!ctx) return;

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + duration
    );

}

function diceSound(){

    if(!soundEnabled) return;

    for(let i=0;i<6;i++){

        setTimeout(
            () =>
                tone(
                    180 + Math.random()*300,
                    .08,
                    "square",
                    .025
                ),
            i*85
        );

    }

}

function winSound(){

    if(!soundEnabled) return;

    const notes =
        [523,659,784,1046];

    notes.forEach(
        (n,i) =>
            setTimeout(
                () =>
                    tone(
                        n,
                        .25,
                        "sine",
                        .08
                    ),
                i*130
            )
    );

}

function createBoard(){

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    for(let row=0;row<11;row++){

        for(let col=0;col<11;col++){

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            const index =
                path.findIndex(
                    p =>
                        p[0]===row &&
                        p[1]===col
                );

            if(index >= 0){
                cell.classList.add("path");
            }

            if(
                row<=3 &&
                col<=3
            ){
                cell.classList.add("redHome");
            }

            if(
                row>=7 &&
                col>=7
            ){
                cell.classList.add("blueHome");
            }

            if(
                row>=4 &&
                row<=6 &&
                col>=4 &&
                col<=6
            ){
                cell.classList.add("center");
            }

            board.appendChild(cell);

        }

    }

}

function getCoordinate(
    position,
    color
){

    if(position === -1){

        return color === "red"
            ? {row:2,col:2}
            : {row:8,col:8};

    }

    if(position < 52){

        const p =
            path[
                position % 52
            ];

        return {
            row:p[0],
            col:p[1]
        };

    }

    if(color === "red"){

        const finalPath = [
            [5,1],
            [5,2],
            [5,3],
            [5,4],
            [5,5]
        ];

        const p =
            finalPath[
                Math.min(
                    4,
                    position-52
                )
            ];

        return {
            row:p[0],
            col:p[1]
        };

    }

    const finalPath = [
        [1,5],
        [2,5],
        [3,5],
        [4,5],
        [5,5]
    ];

    const p =
        finalPath[
            Math.min(
                4,
                position-52
            )
        ];

    return {
        row:p[0],
        col:p[1]
    };

}

function addToken(
    position,
    color,
    index,
    mine
){

    const c =
        getCoordinate(
            position,
            color
        );

    const cell =
        document.querySelector(
            `[data-row="${c.row}"][data-col="${c.col}"]`
        );

    if(!cell) return;

    const token =
        document.createElement("div");

    token.className =
        "token " +
        (
            color==="red"
                ? "redToken"
                : "blueToken"
        );

    token.textContent =
        index+1;

    const offsets = [
        [-15,-15],
        [15,-15],
        [-15,15],
        [15,15]
    ];

    const offset =
        offsets[index];

    token.style.marginLeft =
        offset[0]+"px";

    token.style.marginTop =
        offset[1]+"px";

    if(
        mine &&
        myTurn &&
        currentDice !== null
    ){

        const positionCanMove =
            position === -1
                ? currentDice === 6
                : (
                    position !== 56 &&
                    position + currentDice <= 56
                );

        if(positionCanMove){

            token.classList.add(
                "movable"
            );

            token.onclick =
            () => {

                socket.emit(
                    "movePiece",
                    {
                        pieceIndex:index
                    }
                );

            };

        }

    }

    cell.appendChild(token);

}

function renderPieces(
    myPieces,
    opponentPieces
){

    createBoard();

    myPieces.forEach(
        (position,index) => {

            addToken(
                position,
                myColor,
                index,
                true
            );

        }
    );

    const enemyColor =
        myColor === "red"
            ? "blue"
            : "red";

    opponentPieces.forEach(
        (position,index) => {

            addToken(
                position,
                enemyColor,
                index,
                false
            );

        }
    );

}

function renderState(data){

    roomCode =
        data.roomCode;

    myColor =
        data.myColor;

    myTurn =
        data.myTurn;

    currentDice =
        data.dice;

    gameStarted =
        data.gameStarted;

    document.getElementById(
        "myName"
    ).textContent =
        data.myName;

    document.getElementById(
        "enemyName"
    ).textContent =
        data.opponentName;

    const myFinished =
        data.myPieces.filter(
            p=>p===56
        ).length;

    const enemyFinished =
        data.opponentPieces.filter(
            p=>p===56
        ).length;

    document.getElementById(
        "myScore"
    ).textContent =
        myFinished;

    document.getElementById(
        "enemyScore"
    ).textContent =
        enemyFinished;

    document.getElementById(
        "turnText"
    ).textContent =
        myTurn
            ? "🎯 تو"
            : "⏳ حریف";

    const dice =
        document.getElementById("dice");

    dice.textContent =
        data.dice === null
            ? "🎲"
            : data.dice;

    document.getElementById(
        "rollBtn"
    ).disabled =
        !myTurn ||
        data.dice !== null ||
        !data.gameStarted;

    renderPieces(
        data.myPieces,
        data.opponentPieces
    );

    if(data.gameStarted){

        document.getElementById(
            "status"
        ).textContent =
            myTurn
                ? "🎯 نوبت توست! تاس بینداز."
                : "⏳ منتظر نوبت حریف...";

    }

}

const emojis = [
    "😂","😎","🔥","😱","👏",
    "😍","🎉","😭","🤣","😡",
    "👍","❤️","🎲"
];

function createEmojiButtons(){

    const box =
        document.getElementById(
            "quickEmoji"
        );

    box.innerHTML = "";

    emojis.forEach(
        emoji => {

            const button =
                document.createElement("button");

            button.className =
                "emojiBtn";

            button.textContent =
                emoji;

            button.onclick =
            () => {

                socket.emit(
                    "emoji",
                    {emoji}
                );

            };

            box.appendChild(button);

        }
    );

}

function addChat(
    name,
    color,
    message
){

    const box =
        document.getElementById(
            "messages"
        );

    const item =
        document.createElement("div");

    const mine =
        color === myColor;

    item.className =
        "chatMessage " +
        (
            mine
                ? "chatMine"
                : "chatOther"
        );

    const nameElement =
        document.createElement("div");

    nameElement.className =
        "chatName";

    nameElement.textContent =
        name;

    const messageElement =
        document.createElement("div");

    messageElement.textContent =
        message;

    item.appendChild(
        nameElement
    );

    item.appendChild(
        messageElement
    );

    box.appendChild(
        item
    );

    box.scrollTop =
        box.scrollHeight;

}

function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );

    const message =
        input.value.trim();

    if(!message) return;

    socket.emit(
        "chatMessage",
        {
            message
        }
    );

    input.value = "";

    input.focus();

}

function confetti(){

    const pieces = 100;

    for(let i=0;i<pieces;i++){

        const el =
            document.createElement("div");

        el.className =
            "confetti";

        el.style.left =
            Math.random()*100+"vw";

        el.style.animationDuration =
            (2+Math.random()*3)+"s";

        el.style.animationDelay =
            Math.random()*1.5+"s";

        const colors = [
            "#ff3f68",
            "#2698ff",
            "#ffd43b",
            "#25d39b",
            "#b197fc",
            "#ffffff"
        ];

        el.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        document.body.appendChild(el);

        setTimeout(
            () => el.remove(),
            6000
        );

    }

}

function captureEffect(){

    const el =
        document.createElement("div");

    el.className =
        "captureFlash";

    el.textContent =
        "💥";

    document.body.appendChild(el);

    setTimeout(
        () => el.remove(),
        850
    );

    tone(
        120,
        .15,
        "sawtooth",
        .06
    );

}

document.getElementById(
    "createBtn"
).onclick =
function(){

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    if(!name){

        alert(
            "اول اسمت را وارد کن."
        );

        return;

    }

    socket.emit(
        "createRoom",
        {name}
    );

};

document.getElementById(
    "joinBtn"
).onclick =
function(){

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    const code =
        document.getElementById(
            "roomInput"
        ).value
        .trim()
        .toUpperCase();

    if(!name){

        alert(
            "اول اسمت را وارد کن."
        );

        return;

    }

    if(!code){

        alert(
            "کد اتاق را وارد کن."
        );

        return;

    }

    socket.emit(
        "joinRoom",
        {
            name,
            roomCode:code
        }
    );

};

socket.on(
    "roomCreated",
    data => {

        roomCode =
            data.roomCode;

        document.getElementById(
            "roomCode"
        ).textContent =
            roomCode;

        document.getElementById(
            "roomInfo"
        ).classList
        .remove("hidden");

        document.getElementById(
            "game"
        ).classList
        .remove("hidden");

        document.getElementById(
            "status"
        ).textContent =
            "🏠 کد اتاق را برای دوستت بفرست.";

    }
);

socket.on(
    "gameStarted",
    () => {

        document.getElementById(
            "lobby"
        ).classList
        .add("hidden");

        document.getElementById(
            "game"
        ).classList
        .remove("hidden");

        document.getElementById(
            "status"
        ).textContent =
            "🎲 بازی شروع شد!";

    }
);

socket.on(
    "gameState",
    data => {

        if(data.gameStarted){

            document.getElementById(
                "lobby"
            ).classList
            .add("hidden");

            document.getElementById(
                "game"
            ).classList
            .remove("hidden");

        }

        window.lastMyPieces =
            [...data.myPieces];

        window.lastOpponentPieces =
            [...data.opponentPieces];

        renderState(data);

    }
);

socket.on(
    "diceRolled",
    data => {

        const dice =
            document.getElementById(
                "dice"
            );

        dice.classList.remove(
            "rolling"
        );

        void dice.offsetWidth;

        dice.classList.add(
            "rolling"
        );

        diceSound();

        setTimeout(
            () => {

                dice.textContent =
                    data.dice;

            },
            350
        );

        if(data.dice === 6){

            document.getElementById(
                "gameMessage"
            ).textContent =
                "🎉 شش آوردی! دوباره نوبت توست.";

        }

    }
);

socket.on(
    "noMove",
    data => {

        document.getElementById(
            "gameMessage"
        ).textContent =
            `🎲 عدد ${data.dice} آمد، ولی مهره‌ای برای حرکت نداری.`;

    }
);

socket.on(
    "pieceMoved",
    data => {

        if(
            window.lastMyPieces &&
            window.lastOpponentPieces
        ){

            renderPieces(
                window.lastMyPieces,
                window.lastOpponentPieces
            );

        }

    }
);

socket.on(
    "capture",
    data => {

        captureEffect();

        document.getElementById(
            "gameMessage"
        ).textContent =
            `💥 ${data.player} مهره حریف را زد!`;

    }
);

socket.on(
    "chatMessage",
    data => {

        addChat(
            data.name,
            data.color,
            data.message
        );

        if(
            soundEnabled &&
            data.color !== myColor
        ){

            tone(
                700,
                .08,
                "sine",
                .04
            );

        }

    }
);

socket.on(
    "emoji",
    data => {

        addChat(
            data.name,
            data.color,
            data.emoji
        );

        if(
            data.color !== myColor
        ){

            tone(
                650,
                .08,
                "sine",
                .03
            );

        }

    }
);

socket.on(
    "winner",
    data => {

        const isMe =
            data.color ===
            myColor;

        document.getElementById(
            "winTitle"
        ).textContent =
            isMe
                ? "🏆 تو برنده شدی!"
                : "😄 این بار حریف برنده شد!";

        document.getElementById(
            "winText"
        ).innerHTML =
            isMe
                ? `
                  🎉 تبریک می‌گم
                  <b>${escapeHtml(data.winner)}</b>!
                  <br>
                  فوق‌العاده بازی کردی! 🔥
                  <br>
                  هر چهار مهره‌ات را به مقصد رساندی
                  و پیروز این نبرد شدی! 🏆
                  `
                : `
                  🎲 بازی تمام شد!
                  <br>
                  <b>${escapeHtml(data.winner)}</b>
                  این مسابقه را برد.
                  <br>
                  نگران نباش؛ بازی بعدی می‌تونه مال تو باشه! 💪🔥
                  `;

        document.getElementById(
            "winOverlay"
        ).classList
        .remove("hidden");

        if(isMe){

            confetti();
            winSound();

        }

    }
);

socket.on(
    "opponentLeft",
    () => {

        document.getElementById(
            "status"
        ).textContent =
            "🚪 حریف از بازی خارج شد.";

        document.getElementById(
            "gameMessage"
        ).textContent =
            "حریف اتصالش را قطع کرد.";

    }
);

socket.on(
    "errorMessage",
    data => {

        alert(
            data.message
        );

    }
);

document.getElementById(
    "sendBtn"
).onclick =
sendChat;

document.getElementById(
    "chatInput"
).addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendChat();

        }

    }
);

document.getElementById(
    "rollBtn"
).onclick =
function(){

    if(
        !myTurn ||
        currentDice !== null ||
        !gameStarted
    ){

        return;

    }

    socket.emit(
        "rollDice"
    );

};

document.getElementById(
    "soundBtn"
).onclick =
function(){

    soundEnabled =
        !soundEnabled;

    this.textContent =
        soundEnabled
            ? "🔊"
            : "🔇";

    if(soundEnabled){

        tone(
            700,
            .12,
            "sine",
            .04
        );

    }

};

document.getElementById(
    "inviteBtn"
).onclick =
function(){

    const url =
        location.origin +
        "?room=" +
        encodeURIComponent(
            roomCode
        );

    const text =
        "🎲 بیا با هم منچ آنلاین بازی کنیم! 🔥";

    const telegram =
        "https://t.me/share/url?url=" +
        encodeURIComponent(url) +
        "&text=" +
        encodeURIComponent(text);

    window.open(
        telegram,
        "_blank"
    );

};

document.getElementById(
    "againBtn"
).onclick =
function(){

    location.reload();

};

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

const urlParams =
    new URLSearchParams(
        location.search
    );

const roomFromUrl =
    urlParams.get("room");

if(roomFromUrl){

    document.getElementById(
        "roomInput"
    ).value =
        roomFromUrl
        .toUpperCase();

}

createBoard();

createEmojiButtons();

</script>

</body>
    </html>

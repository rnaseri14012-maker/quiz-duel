<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>نبرد اطلاعات عمومی</title>

<style>

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 94%;
    max-width: 550px;
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 15px 40px #0006;
}

h1 {
    text-align: center;
    color: #243b55;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}

.main {
    background: #243b55;
    color: white;
}

.answer {
    background: #eeeeee;
}

.correct {
    background: green !important;
    color: white;
}

.wrong {
    background: red !important;
    color: white;
}

.hidden {
    display: none;
}

.room {
    text-align: center;
    background: #eef2ff;
    padding: 20px;
    border-radius: 15px;
    margin: 15px 0;
}

.code {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 5px;
    color: #3730a3;
    margin: 10px;
}

.players {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.player {
    flex: 1;
    background: #f3f4f6;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
}

.question {
    background: #f1f3f6;
    padding: 20px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin: 20px 0;
}

.status {
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
}

.small {
    text-align: center;
    color: #777;
}

</style>

</head>

<body>

<div class="game">

<div id="home">

<h1>🧠 نبرد اطلاعات عمومی</h1>

<input
id="name"
maxlength="20"
placeholder="نام خودت را وارد کن">

<button
class="main"
onclick="createRoom()">

🎮 ساخت بازی

</button>

<input
id="room"
placeholder="کد اتاق دوستت">

<button
class="main"
onclick="joinRoom()">

🔗 ورود به بازی

</button>

<p class="small">

برای بازی دو نفره، یک نفر اتاق بسازد
و کد اتاق را برای نفر دوم بفرستد.

</p>

</div>
